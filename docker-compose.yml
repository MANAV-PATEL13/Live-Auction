version: '3.8'

services:
  backend:
    build: .
    container_name: bhaktipurv_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=BhaktiParv
      - VERSION=v2.0.0
      - MONGO_URL=${MONGO_URL:-mongodb+srv://pateltech13_db_user:Dfjmqu3KrjHmwrwU@bhaktiparva.n84jcti.mongodb.net/Bhaktiparva?retryWrites=true&w=majority}
      - REDIS_URL=redis://redis:6379
      - DATABASE_NAME=bhaktipurv
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-cjfw8uikrdkmm88493-03jdjduudjdjdkddld}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=600
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/app"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: bhaktipurv_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data:
