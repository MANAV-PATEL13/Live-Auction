services:
  - type: web
    name: bhaktipurv-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 4
    envVars:
      - key: APP_NAME
        value: BhaktiParv
      - key: VERSION
        value: v2.0.0
      - key: MONGO_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: DATABASE_NAME
        value: bhaktipurv
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 600
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
